# =============================================================================
# .github/workflows/ci.yml - Feature Flag Service CI
#
# Two jobs:
#   1. test           - every push and every pull request
#   2. build-and-push - push to main only, after test passes:
#                       build, scan with Trivy (HIGH/CRITICAL fail the job), and only THEN
#                       push to ECR with the commit SHA as the tag
#
# How a new image gets deployed: this workflow does not touch the deploy repo. Argo CD Image
# Updater in the cluster sees the new tag in ECR and commits it to idp-gitops
# (idp-gitops/platform/image-updater). So an image in ECR is an image that WILL be deployed,
# which is why the scan runs before the push, not after it.
#
# Credentials: none stored. AWS access is OIDC -> IAM role idp-github-ci. The idp-ci-bot key
# that this repo used to hold (to commit the tag itself) is gone.
#
# Image tag: the git commit SHA, never :latest; ECR tags are immutable.
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# GitHub occasionally starts two runs for one push; the second would fail pushing the same
# immutable ECR tag. One run per event+commit; the event is part of the key so a PR run
# never cancels the main-branch run for the same SHA.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Job 1 — test
# Runs on every push and every pull_request. Unchanged from Steps 1-16.
# ---------------------------------------------------------------------------
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: feature_flags_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install dev/test dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql+psycopg2://ci:ci@localhost:5432/feature_flags_ci" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=ci-throwaway-key-not-used-in-production" >> $GITHUB_ENV
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> $GITHUB_ENV
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 2 - build-and-push (push to main only)
  # Order matters: build -> scan -> push. Image Updater deploys whatever appears in ECR, so a
  # vulnerable image must never get there.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build, scan, push to ECR
    runs-on: ubuntu-24.04-arm          # native arm64 = the EKS nodes' architecture
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One build at a time, in push order. Image Updater deploys the image that was BUILT last,
    # so two merges seconds apart must not build in parallel: the older commit could finish
    # second and be deployed (both ran side by side on 2026-10-11). If a third push arrives
    # while one waits, GitHub drops the waiting one; the newest still wins.
    concurrency:
      group: build-main
      cancel-in-progress: false

    permissions:
      id-token: write  # REQUIRED for the OIDC token request to AWS
      contents: read

    env:
      IMAGE: 693906847772.dkr.ecr.ap-south-1.amazonaws.com/feature-flag-service:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Built into the runner's local Docker (same architecture as the nodes), not pushed yet.
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "$IMAGE" .

      # Fails the job on a HIGH or CRITICAL finding that has a fix. Nothing was pushed yet, so
      # a failing image never reaches ECR and is never deployed.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Authenticate to AWS via OIDC - no static credentials. The role's trust policy allows
      # exactly this repository on refs/heads/main.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::693906847772:role/idp-github-ci
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # A re-run of the same commit must not fail on the immutable tag.
      - name: Push image
        run: |
          if aws ecr describe-images --repository-name feature-flag-service \
               --image-ids imageTag="${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "Image ${GITHUB_SHA} already in ECR - skipping push"
          else
            docker push "$IMAGE"
          fi
          echo "Pushed $IMAGE. Image Updater commits this tag to idp-gitops when the cluster is up."
